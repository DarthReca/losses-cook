num_train_epochs: 2
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
warmup_steps: 500
weight_decay: 0.01
logging_dir: "logs"
logging_steps: 10
eval_strategy: "steps"
save_strategy: "steps"
load_best_model_at_end: True
learning_rate: 1e-4
dataloader_num_workers: 4
save_total_limit: 3
use_cpu: False
bf16: True
metric_for_best_model: "eval_question_answering_loss"
greater_is_better: False
eval_steps: 10
gradient_accumulation_steps: 3
optim: adamw_torch
losses:
  question_answering:
    cross_entropy: 0.6
    topological: 0.4
